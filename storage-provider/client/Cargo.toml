[package]
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license-file.workspace = true
name = "polka-storage-provider-client"
repository.workspace = true
version = "0.1.0"

[dependencies]
# "Homegrown" crates
mater = { workspace = true }
polka-storage-proofs = { workspace = true, default-features = false }
polka-storage-provider-common = { workspace = true }
primitives = { workspace = true, features = ["clap", "std"] }
storagext = { workspace = true, features = ["clap"] }

async-trait = { workspace = true }
bellperson = { workspace = true }
bls12_381 = { workspace = true }
blstrs = { workspace = true }
cid = { workspace = true, features = ["std"] }
clap = { workspace = true, features = ["derive"] }
codec = { workspace = true }
ed25519-dalek = { workspace = true, features = ["pem", "pkcs8"] }
filecoin-proofs.workspace = true
hex = { workspace = true }
jsonrpsee = { workspace = true, features = ["http-client", "macros", "server", "ws-client"] }
libp2p.workspace = true
sc-cli = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
subxt = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
url = { workspace = true }

[dev-dependencies]
libp2p = { workspace = true, features = ["cbor", "macros", "noise", "request-response", "tcp", "tokio", "yamux"] }
primitives-p2p = { workspace = true, features = ["serde"] }

[lints]
workspace = true

[features]
cuda = ["polka-storage-proofs/cuda", "polka-storage-proofs/std", "polka-storage-proofs/substrate"]
default = ["opencl"]
opencl = ["polka-storage-proofs/opencl", "polka-storage-proofs/std", "polka-storage-proofs/substrate"]
